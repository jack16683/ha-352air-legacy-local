name: Plus ALCS test toolkit

on:
  push:
    paths:
      - 'diagnostics/plus-alcs/**'
      - '.github/workflows/plus-alcs-toolkit.yml'
  pull_request:
    paths:
      - 'diagnostics/plus-alcs/**'
      - '.github/workflows/plus-alcs-toolkit.yml'

permissions:
  contents: read

jobs:
  synthetic-toolkit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diagnostics/plus-alcs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install cryptography==50.0.2 ruff==0.17.3
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Synthetic and UDP loopback tests
        run: python -m unittest discover -s tests -v
