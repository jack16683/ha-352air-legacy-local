[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "ICN",
  "LOG",
  "PERF",
  "PIE",
  "PLC",
  "PLE",
  "PLW",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.352air_legacy_local"]

[tool.ruff.lint.per-file-ignores]
# The standalone bilingual CLI intentionally contains Chinese punctuation and
# keeps prose readable instead of wrapping every translated terminal message.
"tools/352air_schedule_manager.py" = ["E501", "PERF203", "PLW0603", "RUF001"]

[tool.mypy]
# HA 2026.8 itself uses Python 3.14 syntax. Runtime syntax compatibility with
# the provisional HA 2025.12 floor is checked separately by Ruff and CI 3.13.
python_version = "3.14"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
